<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
  box-sizing: border-box;
}

.slider {
  width: 360px;
  height: 640px;
  overflow: hidden;
}

.slider-wrapper {
  width: 100%;
  height: 560px;
}

.slider-wrapper img {
  width: 100%;
  height: 100%;
  display: block;
}

.slider-footer {
  height: 80px;
  background-color: rgb(100, 67, 68);
  padding: 12px 12px 0 12px;
  position: relative;
}

.slider-footer .toggle {
  position: absolute;
  right: 0;
  top: 12px;
  display: flex;
}

.slider-footer .toggle button {
  margin-right: 12px;
  width: 28px;
  height: 28px;
  appearance: none;
  border: none;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border-radius: 4px;
  cursor: pointer;
}

.slider-footer .toggle button:hover {
  background: rgba(255, 255, 255, 0.2);
}

.slider-footer p {
  margin: 0;
  color: #fff;
  font-size: 18px;
  margin-bottom: 10px;
}

.slider-indicator {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  align-items: center;
}

.slider-indicator li {
  width: 8px;
  height: 8px;
  margin: 4px;
  border-radius: 50%;
  background: #fff;
  opacity: 0.4;
  cursor: pointer;
}

.slider-indicator li.active {
  width: 12px;
  height: 12px;
  opacity: 1;
}
</style>
</head>

<body>
    <div class="slider">
        <div class="slider-wrapper">
            <img src="../images/image1.jpg" alt="">
        </div>
        <div class="slider-footer">
            <p>对人类来说会不会太超前了</p>
            <ul class="slider-indicator">
                <li class="active"></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
            <div class="toggle">
                <button class="prev">1</button>
                <button class="next">2</button>
            </div>
        </div>
    </div>
    <script>
        const sliderData = [
            { url: '../images/image1.jpg', title: '对人类来说会不会太超前了', color: 'rgb(100,67,68)' },
            { url: '../images/image2.jpg', title: '对人类来说会不会太超前了', color: 'rgb(36,31,33)' },
            { url: '../images/image3.jpg', title: '对人类来说会不会太超前了', color: 'rgb(166,131,143)' },
            { url: '../images/image4.jpg', title: '对人类来说会不会太超前了', color: 'rgb(67,90,92)' }]

        const img = document.querySelector('.slider-wrapper img')
        const p = document.querySelector('.slider-footer p')

        let i = 0
        let n = setInterval(function(){
          i++
          // 无缝滚动位置
          if(i >= sliderData.length){
            i = 0
          }

          img.src = sliderData[i].url
          p.innerHTML = sliderData[i].title

          document.querySelector('.slider-indicator .active').classList.remove('active')

          document.querySelector(`.slider-indicator li:nth-child(${i + 1})`).classList.add('active')
        },1000)
    </script>
</body>

</html>
