<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div></div>
    <script>
        //实例化 new
        //1. 得到当前时间
        const date = new Date()
        console.log(date)

        //2.指定时间
        const date_1 = new Date('2022-5-1 08:30:00')


        const div = document.querySelector('div')
        function getMyDate(){
            const date = new Date()

            let h = date.getHours()
            let m = date.getMinutes()
            let s = date.getSeconds()

            h = h < 10 ? '0' + h : h
            m = m < 10 ? '0' + m : m
            s = s < 10 ? '0' + s : s

            return `今天是：${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}号 ${h}:${m}:${s}`
        }

        div.innerHTML = getMyDate()

        setInterval(function(){
            div.innerHTML = getMyDate()
        },1000)




        //时间的另外一个快速写法
        //div.innerHTML = date.toLocaleString()
        //得到简写时间，例如2026/6/10 09:41:00
    </script>
</body>
</html>
