<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            background: url(../images/image1.jpg) no-repeat top center / cover;
        }
    </style>

    <script>
        function getRandom(N,M){
            return Math.floor(Math.random()*(M - N +1)) + N
        }

        const random = getRandom(1,4)

        document.body.style.backgroundImage = `url(../images/image${random}.jpg)`
    </script>
</body>
</html>
