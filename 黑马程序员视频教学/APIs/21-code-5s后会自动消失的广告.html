<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            position: fixed;
            top: 0;
            left: 0;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <img src="#" alt="">
    <script>
        const img = document.querySelector("img")

        setTimeout(function(){
            img.style.display = "none"
        },5000)

        clearTimeout()
    </script>
</body>
</html>
