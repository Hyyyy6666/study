<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <script>
        const box = document.querySelector('.box')
        //记得跟单位
        box.style.width = '300px'
        //遇到多组单词的采取小驼峰命名法
        box.style.backgroundColor = 'hotpink'
    </script>
</body>
</html>
