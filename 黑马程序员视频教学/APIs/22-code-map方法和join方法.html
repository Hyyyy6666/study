<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1.map方法:得到新数组
        const  arr = ['red','blue','green','pink']

        const newArr = arr.map(function(ele,index){
            console.log(ele)
            console.log(index)

            return ele + '颜色'
        })


        //s 2.join()把数组中的所有元素转换一个字符串
        newArr.join()
        console.log(newArr.join())
    </script>
</body>
</html>
