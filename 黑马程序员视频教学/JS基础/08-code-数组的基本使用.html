    <script>
        //数组求和以及平均值
        let arr=[2,6,1,7,4]
        //1.求和的变量sum
        let sum = 0

        //2. 遍历累加

        for(let i = 0; i < arr.length ; i++){
            sum += arr[i]
        }

        console.log(`数组的和是${sum}`)

        //3. 平均值 = 和 / arr.length = 4
        console.log(`数组的平均值是${sum / arr.length}`)

        arr_1.push('pink')
        arr_1.unshift('black')
