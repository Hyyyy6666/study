<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>
        function getRandom(N,M){
            return Math.floor(Math.random()*(M - N + 1) * N)
        }

        let random = getRandom(1,10)

        console.log(random)

        let flag = 1

        for(let i = 1; i <= 5 ; i++){
            let num = +prompt('请输入你猜的数字')

            if(num > random){
                alert('你猜大了')
            }else if(num < random){
                alert('你猜小了')
            }else{
                alert('congradulation!')
                flag = 0
                break
            }
        }

        if(flag){
            alert('很遗憾,次数已用完,你没有猜中')
        }
    </Script>
</body>
</html>
