<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柱状图</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .box{
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            text-align: center;
            height: 500px;
            width: 700px;
            border-left: 1px solid pink;
            border-bottom: 1px solid pink;
            margin: 50px auto;
        }

        .box>div{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-color: pink;
            width: 50px;
        }

        .box div span{
            margin-top: -20px;
        }

        .box div h4{
            margin-bottom: -35px;
            width: 70px;
            margin-left: -10px;
        }
    </style>
</head>
<body>
    <script>
        let arr = []
        for(let i = 1;i <= 4 ; i++){
            arr.push(prompt(`请输入第${i}季度的销售额`))
        }

        document.write(`<div class='box'>`)

        for(let i = 0 ; i < arr.length ; i++){
            document.write(`
                <div style = "height: ${arr[i]}px;">
                    <span>${arr[i]}</span>
                    <h4>第${i+1}季度</h4>
                </div>
            `)
        }

        document.write(`</div>`)
    </script>
</body>
</html>
